<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>Presenze stage</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14202b;--mut:#4a5968;--line:#cdd5dd;--acc:#0b57d0;--accd:#fff;--ok:#0a7a3d;--okbg:#c8f0d2;--ko:#a32020;--kobg:#f6c9c9;--pv:#8a5a00;--pvbg:#fde9b8;--nl:#e7eaee;--warn:#fff8e1;--warnl:#e6c96a}
:root[data-theme="dark"]{--bg:#10161c;--card:#1a232c;--ink:#e8eef4;--mut:#a9b7c4;--line:#33424f;--acc:#8ab4f8;--accd:#10161c;--ok:#7fd69b;--okbg:#17402a;--ko:#ff9b9b;--kobg:#4a2222;--pv:#f2c66d;--pvbg:#4a3a12;--nl:#26313b;--warn:#3a3213;--warnl:#7a6a22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#1a232c;--ink:#e8eef4;--mut:#a9b7c4;--line:#33424f;--acc:#8ab4f8;--accd:#10161c;--ok:#7fd69b;--okbg:#17402a;--ko:#ff9b9b;--kobg:#4a2222;--pv:#f2c66d;--pvbg:#4a3a12;--nl:#26313b;--warn:#3a3213;--warnl:#7a6a22}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
main{max-width:760px;margin:0 auto;padding:14px 16px 60px}
.menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.menu a{text-decoration:none;color:var(--acc);font-weight:700;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px}
.menu a:hover{border-color:var(--acc)}
h1{font-size:28px;line-height:1.2;margin:8px 0 4px}
h2{font-size:22px;margin:0 0 10px}
p{margin:6px 0}
.sub,.small{color:var(--mut)}.small{font-size:15px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:16px;border:2px solid var(--line)}
.badge.view{border-color:var(--acc);color:var(--acc)}
.badge.edit{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.btn{min-height:52px;padding:10px 16px;border-radius:12px;border:2px solid var(--acc);background:var(--acc);color:var(--accd);font-weight:700;font-size:18px;line-height:1.2;font-family:inherit;cursor:pointer;touch-action:manipulation}
.btn.sec{background:transparent;color:var(--acc)}
.btn.ko{background:transparent;color:var(--ko);border-color:var(--ko)}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:52px;font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:96px}
input[type=checkbox]{width:28px;min-height:28px;height:28px;margin:0}
.msg{min-height:26px;font-weight:700}.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
.warn{background:var(--warn);border:1px solid var(--warnl);border-radius:10px;padding:10px 12px;margin:10px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
[hidden]{display:none!important}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.cards{grid-template-columns:repeat(5,1fr)}}
.card{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.card b{display:block;font-size:28px;
